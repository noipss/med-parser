[package]
name = "uzi-parser"
version = "0.1.0"
description = "Парсер врачей УЗИ"
edition = "2021"

[lib]
name = "uzi_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
